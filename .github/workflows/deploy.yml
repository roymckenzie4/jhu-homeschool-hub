# Builds `main` and deploys it to GitHub Pages root:
#   https://<user>.github.io/jhu-homeschool-hub/
#
# The reorg branch was an A/B preview built alongside main at /new/ while JHU
# picked a direction; that collapsed once reorg merged into main (see
# decisions.md, the reorg -> main merge). A static redirect stub at
# public/new/index.html keeps reviewers' old /new/ links from 404ing.
#
# To enable: Settings -> Pages -> Source = "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual "Run workflow" button, plus a weekly refresh so the regulation
  # snapshot picks up JHU's sheet edits on its own. `schedule` and
  # `workflow_dispatch` only fire from the DEFAULT branch, which this now is.
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # Mondays, 12:00 UTC

# Pages deployments need these scoped permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# Run the bundled JavaScript actions (checkout, setup-node, etc.) on
# Node.js 24. GitHub is making this the runner default in June 2026 and
# removing Node 20 from runners in September 2026; opting in early avoids
# the deprecation warnings without changing behavior.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one Pages deploy at a time; let an in-flight deploy finish rather
# than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # Refresh the regulation source-link snapshot from the JHU Google Sheet
      # before building. Non-fatal: on any failure — transient API outage,
      # quota — the committed snapshot is used, so a bad fetch can never
      # break the deploy.
      - name: Refresh regulation snapshot
        run: node scripts/fetch-policy-snapshot.mjs || echo "snapshot refresh failed; using committed snapshot"
        env:
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}

      # Refresh the enrollment snapshot from JHU's workbook (downloaded via the
      # Drive API and read with SheetJS — see the script). Same non-fatal guard.
      - name: Refresh enrollment snapshot
        run: node scripts/fetch-enrollment-snapshot.mjs || echo "snapshot refresh failed; using committed snapshot"
        env:
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /jhu-homeschool-hub/
          # GA4 Measurement ID for the live build. Set the VITE_GA_ID repo
          # variable to enable analytics; unset = no tracking.
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
